<p>Your engineers focus on what they do best. <strong>We handle the infrastructure quality layer.</strong></p>
<p>I'd love to either start a pilot or schedule a deeper technical demo. <em>What works best for your team?</em></p>
<p><em>Reference their earlier answers:</em> "Based on what you shared about [priority/bottleneck], I think the fastest way to prove value is [specific workstream]. We could have the first PR up within days."</p>`,
    tip: "If asked 'why can't we just do this ourselves?' — acknowledge they could. The question is whether it's the best use of their senior engineers' time at 14x ROI."
  }
];

let current = 0;
let timerRunning = false;
let timerSeconds = 0;
let timerInterval = null;

// Build nav
const nav = document.getElementById('slideNav');
slides.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'nav-item' + (i === 0 ? ' active' : '');
  item.innerHTML = `<span class="nav-num">${s.num}</span><span class="nav-label">${s.label}</span>`;
  item.onclick = () => goTo(i);
  nav.appendChild(item);
});

function goTo(index) {
  if (index < 0 || index >= slides.length) return;
  current = index;
  render();
}

function render() {
  const s = slides[current];

  // Counter + title
  document.getElementById('currentNum').textContent = s.num;
  document.getElementById('currentTitle').textContent = s.title;

  // Progress
  document.getElementById('progressFill').style.width = ((current + 1) / slides.length * 100) + '%';

  // Nav active state
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === current);
    if (i === current) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  // Notes
  const panel = document.getElementById('notesPanel');
  let html = `
    <div class="notes-header">
      <span class="notes-slide-num">Slide ${s.num}</span>
      <span class="notes-slide-label">${s.label}</span>
    </div>
    <div class="notes-title">${s.title}</div>
    <div class="notes-body">${s.notes}</div>
  `;
  if (s.tip) {
    html += `<div class="tip-box"><div class="tip-label">Presenter Tip</div>${s.tip}</div>`;
  }
  panel.innerHTML = html;
  panel.scrollTop = 0;

  // Upcoming
  const upcoming = document.getElementById('upcomingPanel');
  let upHtml = '<div class="upcoming-label">Up Next</div>';
  for (let i = current + 1; i < Math.min(current + 4, slides.length); i++) {
    upHtml += `
      <div class="upcoming-card" onclick="goTo(${i})" style="cursor:pointer;">
        <div class="upcoming-card-num">Slide ${slides[i].num}</div>
        <div class="upcoming-card-title">${slides[i].label}</div>
        <div class="upcoming-card-preview">${slides[i].title}</div>
      </div>
    `;
  }
  if (current === slides.length - 1) {
    upHtml += `<div class="upcoming-card last-slide">
      <div class="upcoming-card-num">End</div>
      <div class="upcoming-card-title">No more slides</div>
      <div class="upcoming-card-preview">You did great.</div>
    </div>`;
  }
  upcoming.innerHTML = upHtml;
}

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    goTo(current + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    goTo(current - 1);
  } else if (e.key === 'Home') {
    e.preventDefault();
    goTo(0);
  } else if (e.key === 'End') {
    e.preventDefault();
    goTo(slides.length - 1);
  } else if (e.key === 't' || e.key === 'T') {
    toggleTimer();
  }
});

// Timer
function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
  } else {
    timerRunning = true;
    timerInterval = setInterval(() => {
      timerSeconds++;
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      const el = document.getElementById('timer');
      el.textContent = m + ':' + s;
      el.className = 'timer' + (timerSeconds > 1500 ? ' danger' : timerSeconds > 1200 ? ' warning' : '');
    }, 1000);
  }
}

// Init
render();
</script>
</body>
</html>
